# Desenvolvimento pela IDE / ./mvnw spring-boot:run (perfil padrao, ver spring.profiles.default).

# O spring-boot-docker-compose sobe tambem os profiles observability (Prometheus, Loki, Alloy, Grafana)
# e mail (Mailpit, caixa de entrada de teste em http://localhost:8025),
# mas nao o app: a API e esta, rodando no host. start-only: parar a API nao derruba a stack.
spring.docker.compose.profiles.active=observability,mail
spring.docker.compose.lifecycle-management=start-only
# Sempre roda o "docker compose up" (idempotente). O padrao (if-running) pula o up se qualquer servico ja
# estiver de pe: com a stack rodando e o db parado/removido, o banco nunca voltaria e a API nao subiria
spring.docker.compose.start.skip=never

# Console em texto (legivel na IDE) e uma copia em JSON (ECS) no arquivo, que o Alloy le e manda ao Loki
logging.file.name=logs/eletrolonghi.log
logging.structured.format.file=ecs
