spring.application.name=eletrolonghi

# Sem perfil ativo (IDE, ./mvnw spring-boot:run) sobe com o application-dev.properties.
# O container da API (docker-compose, servico app) ativa o perfil "docker" e nao herda o dev.
spring.profiles.default=dev

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:eletrolonghi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# Actuator numa porta propria, que o compose nao publica: health (healthcheck da imagem) e prometheus (metricas)
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
# Histograma do HTTP: o Grafana calcula p95/p99 por rota (sem isso so ha media e maximo)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Tracing sem exportador, so para os logs: toda requisicao ganha traceId/spanId (MDC)
management.tracing.sampling.probability=1.0

# JWT Secret Token
spring.security.secret=${JWT_SECRET:dev-only-secret-change-me}
spring.security.access-token-expiration-seconds=3600
spring.security.refresh-token-expiration-ms=604800000

# Login brute-force protection
spring.security.login.max-attempts=5
spring.security.login.block-duration-ms=900000

# CORS - origens permitidas a chamar a API (front-end web / Electron renderer)
spring.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173

# Spring Doc
springdoc.api-docs.path=/api/api-docs
springdoc.override-with-generic-response=false

# Dados da loja (cabeçalho do comprovante de serviço)
shop.name=${SHOP_NAME:Eletro Longhi}
shop.document=${SHOP_DOCUMENT:}
shop.address=${SHOP_ADDRESS:}
shop.phone=${SHOP_PHONE:}
shop.email=${SHOP_EMAIL:}
# Garantia do serviço impressa no comprovante (CDC art. 26: 90 dias). 0 omite a linha de garantia.
shop.warranty-days=${SHOP_WARRANTY_DAYS:90}

# Mercado Pago - integração futura (maquininha via API Point). Sem token, o client fica inativo.
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.base-url=${MP_BASE_URL:https://api.mercadopago.com}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}

# Admin bootstrap
app.admin.name=${ADMIN_NAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@eletrolonghi.com}
app.admin.password=${ADMIN_PASSWORD:admin@123}
