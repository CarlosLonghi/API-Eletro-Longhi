spring.application.name=eletrolonghi

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/eletrolonghi
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# JWT Secret Token
spring.security.secret="secret-hash"
spring.security.access-token-expiration-seconds=3600
spring.security.refresh-token-expiration-ms=604800000

# Login brute-force protection
spring.security.login.max-attempts=5
spring.security.login.block-duration-ms=900000

# CORS - origens permitidas a chamar a API (front-end web / Electron renderer)
spring.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173

# Spring Doc
springdoc.api-docs.path=/api/api-docs
springdoc.override-with-generic-response=false

# Admin bootstrap
app.admin.name=admin
app.admin.email=admin@eletrolonghi.com
app.admin.password=admin@123
