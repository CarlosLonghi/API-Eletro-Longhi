# Contact point do Discord e política que manda todos os alertas para ele.
# Fora de provisioning/: o entrypoint do Grafana (docker-compose.yml) só o copia para lá quando
# GRAFANA_DISCORD_WEBHOOK_URL está preenchida no .env.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: eletrolonghi-discord
        type: discord
        settings:
          url: $GRAFANA_DISCORD_WEBHOOK_URL
          use_discord_username: false

policies:
  - orgId: 1
    receiver: discord
    group_by: [ grafana_folder, alertname ]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
