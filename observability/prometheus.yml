# Coleta as métricas da API pela porta de gerência (8081) e as do Postgres pelo exporter.
# Nenhuma dessas portas é publicada: só existem na rede interna do compose.
# Convenção: job = nome do serviço no compose (os logs no Loki têm o label service com o mesmo nome).
global:
  scrape_interval: 15s

scrape_configs:
  # Dois endereços para o mesmo job: a API em container (profile app) ou rodando na IDE, no host.
  # Um dos dois está sempre fora; por isso o alerta "Alvo fora" e os painéis de "no ar" usam max(up)
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "app:8081", "host.docker.internal:8081" ]

  - job_name: postgres
    static_configs:
      - targets: [ "postgres-exporter:9187" ]
